name: Nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            # the older debian has an older glibc, so the libraries load on more systems
            container: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Linux tools
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build
      - name: macOS tools
        if: runner.os == 'macOS'
        run: brew install ninja nasm pkgconf
      - name: Windows tools
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_INSTALL=%%i"
          if not defined VS_INSTALL exit /b 1
          call "%VS_INSTALL%\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1
          echo PATH=%PATH%>> "%GITHUB_ENV%"
          echo LIB=%LIB%>> "%GITHUB_ENV%"
          echo INCLUDE=%INCLUDE%>> "%GITHUB_ENV%"
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bash .github/build.sh "$TARGET"
          # an artifact drops the links and the mark of a program from its files, a tar keeps them
          tar -cf "$TARGET.tar" -C dist .
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.target }}.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TZ: UTC
        run: |
          for part in *.tar; do
            mkdir "${part%.tar}"
            tar -xf "$part" -C "${part%.tar}"
            tar --sort=name --mtime=1980-01-01 --owner=0 --group=0 --numeric-owner -cf - -C "${part%.tar}" . | gzip -n > "$part.gz"
          done
          sha256sum ./*.tar.gz > SHA256SUMS
          tag="nightly-$(date -u +%Y%m%d)-${GITHUB_SHA:0:12}"
          gh release create "$tag" ./*.tar.gz SHA256SUMS \
            --target "$GITHUB_SHA" --title "$tag" --notes "Built from $GITHUB_SHA." --latest
